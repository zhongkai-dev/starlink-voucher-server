<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlink Voucher Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            letter-spacing: 3px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 10px;
            color: #00d4ff;
        }
        
        .stat-card p {
            opacity: 0.8;
        }
        
        .actions {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        input {
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            font-size: 16px;
            width: 200px;
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
        
        .vouchers-table {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        th {
            background: rgba(0, 212, 255, 0.2);
            font-weight: bold;
        }
        
        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
        }
        
        .status.used {
            background: rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
        }
        
        .status.available {
            background: rgba(0, 255, 0, 0.3);
            color: #51cf66;
        }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #51cf66;
            color: #51cf66;
        }
        
        .message.error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 STARLINK VOUCHER MANAGEMENT</h1>
        
        <div id="message" class="message"></div>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <h3 id="total">0</h3>
                <p>Total Vouchers</p>
            </div>
            <div class="stat-card">
                <h3 id="used">0</h3>
                <p>Used</p>
            </div>
            <div class="stat-card">
                <h3 id="available">0</h3>
                <p>Available</p>
            </div>
        </div>
        
        <div class="actions">
            <input type="number" id="countInput" placeholder="Number of codes" value="1" min="1" max="100">
            <button onclick="generateVouchers()">Generate Vouchers</button>
            <button onclick="refreshData()">Refresh</button>
        </div>
        
        <div class="vouchers-table">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Voucher Code</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th>Used At</th>
                    </tr>
                </thead>
                <tbody id="vouchersTable">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 40px;">
                            Loading vouchers...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.origin;
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 3000);
        }
        
        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/api/vouchers/stats`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('total').textContent = data.total;
                    document.getElementById('used').textContent = data.used;
                    document.getElementById('available').textContent = data.available;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        async function loadVouchers() {
            try {
                const res = await fetch(`${API_BASE}/api/vouchers`);
                const data = await res.json();
                if (data.success) {
                    const tbody = document.getElementById('vouchersTable');
                    if (data.vouchers.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px;">No vouchers yet. Generate some!</td></tr>';
                    } else {
                        tbody.innerHTML = data.vouchers.map(v => `
                            <tr>
                                <td>${v.id}</td>
                                <td><strong>${v.code}</strong></td>
                                <td><span class="status ${v.is_used ? 'used' : 'available'}">${v.is_used ? 'USED' : 'AVAILABLE'}</span></td>
                                <td>${new Date(v.created_at).toLocaleString()}</td>
                                <td>${v.used_at ? new Date(v.used_at).toLocaleString() : '-'}</td>
                            </tr>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error('Error loading vouchers:', error);
                showMessage('Error loading vouchers', 'error');
            }
        }
        
        async function generateVouchers() {
            const count = parseInt(document.getElementById('countInput').value) || 1;
            if (count < 1 || count > 100) {
                showMessage('Please enter a number between 1 and 100', 'error');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/api/vouchers/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ count })
                });
                const data = await res.json();
                if (data.success) {
                    showMessage(`Generated ${data.codes.length} voucher code(s) successfully!`, 'success');
                    refreshData();
                }
            } catch (error) {
                showMessage('Error generating vouchers', 'error');
            }
        }
        
        async function refreshData() {
            await Promise.all([loadStats(), loadVouchers()]);
        }
        
        // Load data on page load
        refreshData();
        // Auto-refresh every 10 seconds
        setInterval(refreshData, 10000);
    </script>
</body>
</html>
